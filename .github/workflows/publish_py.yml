name: Build and Publish HsdPy To PyPI

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-libraries:
    name: Build libraries (${{ matrix.os }}, ${{ matrix.arch }})
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: ${{ startsWith(matrix.os, 'windows') && 'msys2 {0}' || 'bash' }}
    strategy:
      matrix:
        include:
          # AMD64 builds
          - os: ubuntu-latest
            lib-name: libhsd.so
            arch: amd64
            artifact-name: libhsd-amd64.so
          - os: macos-15-intel
            lib-name: libhsd.dylib
            arch: amd64
            artifact-name: libhsd-amd64.dylib
          - os: windows-latest
            lib-name: hsd.dll
            arch: amd64
            artifact-name: hsd-amd64.dll
            msystem: UCRT64
            toolchain: mingw-w64-ucrt-x86_64-gcc

          # ARM64 builds
          - os: ubuntu-24.04-arm
            lib-name: libhsd.so
            arch: arm64
            artifact-name: libhsd-arm64.so
          - os: macos-latest
            lib-name: libhsd.dylib
            arch: arm64
            artifact-name: libhsd-arm64.dylib
          - os: windows-11-arm
            lib-name: hsd.dll
            arch: arm64
            artifact-name: hsd-arm64.dll
            msystem: CLANGARM64
            toolchain: mingw-w64-clang-aarch64-clang

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential make file

      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install make

      - name: Install build tools (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: ${{ matrix.msystem }}
          install: make file ${{ matrix.toolchain }}

      - name: Build library
        run: make build-release ARCH=${{ matrix.arch == 'arm64' && 'aarch64' || 'x86_64' }}

      - name: Check library architecture and rename artifact
        env:
          EXPECTED_ARCH: ${{ matrix.arch == 'arm64' && 'aarch64|arm64' || 'x86-64|x86_64' }}
          LIBRARY: lib/${{ matrix.lib-name }}
          ARTIFACT: lib/${{ matrix.artifact-name }}
        run: |
          set -euo pipefail
          file -b "$LIBRARY" | tr '[:upper:]' '[:lower:]' | grep -E "$EXPECTED_ARCH"
          cp "$LIBRARY" "$ARTIFACT"

      - name: Upload library artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}
          path: lib/${{ matrix.artifact-name }}
          if-no-files-found: error

  build-wheel:
    name: Build Python wheel
    needs: build-libraries
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all libraries
        uses: actions/download-artifact@v4
        with:
          path: temp-libs/

      - name: Setup library directory
        run: |
          mkdir -p bindings/python/hsdpy/
          cp temp-libs/libhsd-amd64.so/libhsd-amd64.so bindings/python/hsdpy/
          cp temp-libs/libhsd-arm64.so/libhsd-arm64.so bindings/python/hsdpy/
          cp temp-libs/libhsd-amd64.dylib/libhsd-amd64.dylib bindings/python/hsdpy/
          cp temp-libs/libhsd-arm64.dylib/libhsd-arm64.dylib bindings/python/hsdpy/
          cp temp-libs/hsd-amd64.dll/hsd-amd64.dll bindings/python/hsdpy/
          cp temp-libs/hsd-arm64.dll/hsd-arm64.dll bindings/python/hsdpy/
          ls -la bindings/python/hsdpy/
        shell: bash

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Build and test release wheel
        run: |
          python -m pip install uv
          uv build --wheel --out-dir dist
          uv venv .venv
          uv pip install dist/*.whl pytest pytest-cov scipy
          .venv/bin/python -m pytest bindings/python/tests --tb=short
          .venv/bin/python tests/test_release_wheel.py

      - name: Publish HsdPy to PyPI
        env:
          PYPI_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
        run: |
          make python-publish

      - name: Upload wheel artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-wheel
          path: dist/*.whl
